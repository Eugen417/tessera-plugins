id: weather_informer
version: 0.2.3
api: "0.10"
icon: weather-partly-cloudy
maintainer: ojgensapurin
license: MIT
stage: stable
topics: [weather]
boards: any

tiles:
  - id: dashboard
    name: tile_name
    icon: weather-partly-cloudy
    sizes: { min: 4x2, max: 8x6, full: true }
    memory: 4000
    example: tile_example
    domains: [sensor, weather]
    # Убираем жесткое требование наличия всех атрибутов
    # has_attributes: [wind_speed, pressure]
    attributes: [humidity, wind_speed, wind_bearing, pressure, gust]
    
    # Возвращаем ручной выбор датчиков для гибкости
    options:
      - id: temp_sensor
        kind: entity
        label: temp_sensor
        hint: temp_sensor_hint
        domains: [sensor]
      - id: wind_sensor
        kind: entity
        label: wind_sensor
        hint: wind_sensor_hint
        domains: [sensor]
      - id: pressure_sensor
        kind: entity
        label: pressure_sensor
        hint: pressure_sensor_hint
        domains: [sensor]


