id: weather_informer
version: 0.1.2
api: "0.10"
icon: weather-partly-cloudy
maintainer: ojgensapurin
license: MIT
stage: stable
topics: [weather]
boards: any

tiles:
  - id: informer
    name: tile_name
    icon: weather-partly-cloudy
    sizes: { min: 2x1, max: 4x4 }
    memory: 2000
    example: tile_example
    domains: [sensor]
    options:
      - id: bt_sensor
        kind: entity
        label: bt_sensor
        hint: bt_sensor_hint
        domains: [sensor]
      - id: zigbee_sensor
        kind: entity
        label: zigbee_sensor
        hint: zigbee_sensor_hint
        domains: [sensor]
      - id: mode
        kind: choice
        label: mode
        default: average
        choices:
          - { value: average, label: mode_average }
          - { value: bt_only, label: mode_bt }
          - { value: zigbee_only, label: mode_zigbee }


